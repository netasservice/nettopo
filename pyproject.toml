[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nettopo"
version = "0.9.1"
description = "Generate draw.io network diagrams (L2, STP, HSRP, BGP) from saved Cisco show-command captures."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Israel Fernandez", email = "israelfdzhdz@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "n2g>=0.3.2",
    "textfsm>=1.1.3",
    "ntc-templates>=6.0.0",
    "python-igraph>=0.11.0",
    "netmiko>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.scripts]
nettopo = "nettopo.cli:main"

[project.urls]
Homepage = "https://github.com/netasservice/nettopo"
Issues = "https://github.com/netasservice/nettopo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# PROJECT_SPEC.md embeds illustrative Python in fenced code blocks; it is a synced copy
# of the master spec, not source code, so ruff must not reformat it.
extend-exclude = ["PROJECT_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nettopo"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ntc_templates.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "N2G.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "netmiko.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nettopo --cov-report=term-missing"

[tool.coverage.run]
source = ["src/nettopo"]
